# Updated User table with authentication fields
class: User
table: users
fields:
  id: UuidValue, defaultModel=random
  userType: UserType
  status: UserStatus, default=active
  
  # Basic Info
  email: String?
  phoneNumber: String
  countryCode: String
  isPhoneVerified: bool, default=false
  
  # Messaging Platform IDs
  whatsappId: String?
  telegramId: String?
  
  # Profile
  firstName: String?
  lastName: String?
  profileImageUrl: String?
  language: String, default='en'
  timezone: String, default='UTC'
  
  # Location
  city: String?
  state: String?
  country: String?
  
  # Authentication Fields (NEW)
  emailVerified: bool, default=false
  emailVerifiedAt: DateTime?
  
  # Platform Authentication Status (NEW)
  whatsappAuthenticated: bool, default=false
  telegramAuthenticated: bool, default=false
  webAuthenticated: bool, default=false
  
  # Session Management (NEW)
  lastWhatsappLogin: DateTime?
  lastTelegramLogin: DateTime?
  lastWebLogin: DateTime?
  
  # Verification (NEW)
  verificationCode: String?
  verificationCodeExpiry: DateTime?
  verificationAttempts: int, default=0
  
  # Timestamps
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
  lastActiveAt: DateTime?
  
  # Soft Delete
  deletedAt: DateTime?

indexes:
  user_type_status_idx:
    fields: userType, status
  phone_idx:
    fields: phoneNumber, countryCode
  whatsapp_idx:
    fields: whatsappId
  telegram_idx:
    fields: telegramId
  email_idx:
    fields: email
  whatsapp_auth_idx:
    fields: whatsappId, whatsappAuthenticated
  telegram_auth_idx:
    fields: telegramId, telegramAuthenticated
