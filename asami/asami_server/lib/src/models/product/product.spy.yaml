class: Product
table: products
fields:
  id: UuidValue, defaultModel=random
  vendorId: UuidValue
  vendor: VendorProfile?, relation(field=vendorId)
  
  # ✅ BASIC INFO (Meta Required)
  name: String                      # → Meta: title
  description: String               # → Meta: description (HTML allowed)
  shortDescription: String?         # For previews/cards
  category: String                  # → Meta: google_product_category
  subCategory: String?
  tags: List<String>?
  
  # ✅ META CATALOG FIELDS (Enhanced)
  facebookCategory: String?         # Meta's product category
  facebookCategoryId: String?
  googleCategory: String?           # Google product taxonomy
  googleCategoryId: String?
  
  # ✅ PRICING (Meta Required)
  basePrice: double                 # → Meta: price (format: "100.4 USD")
  discountPrice: double?
  discountPercentage: double?
  discountStartDate: DateTime?
  discountEndDate: DateTime?
  currency: String, default='NGN'   # → Meta: price currency
  
  # ✅ INVENTORY (Meta Required)
  sku: String?                      # Unique product identifier
  barcode: String?
  quantity: int, default=1          # ✅ FIXED: Default 1, not 0
  lowStockThreshold: int, default=5
  trackInventory: bool, default=true
  
  # ✅ AVAILABILITY (Meta Required)
  status: ProductStatus, default=draft
  isActive: bool, default=true
  isFeatured: bool, default=false
  condition: ProductCondition, default=newItem  # → Meta: condition
  
  # ✅ PHYSICAL ATTRIBUTES
  weight: double?
  weightUnit: String?, default='kg'
  dimensions: String?               # Format: "10x20x5 cm"
  color: List<String>?
  size: List<String>?
  material: String?
  brand: String?                    # → Meta: brand (Required!)
  
  # ✅ MEDIA (Meta Required)
  images: List<String>              # → Meta: image_link (first) + additional_image_link
  thumbnailUrl: String?             # For lists/cards
  videoUrl: String?
  videoThumbnailUrl: String?
  
  # ✅ PLATFORM MEDIA IDS (For CDN-less mode)
  whatsappMediaIds: List<String>?   # Store WhatsApp media IDs
  telegramFileIds: List<String>?    # Store Telegram file IDs
  
  # ✅ CDN STATUS
  cdnUploadStatus: String, default='pending'  # pending/uploading/completed/failed
  cdnUploadedAt: DateTime?
  originalMediaUrls: List<String>?  # Backup URLs
  
  # ✅ META CATALOG INTEGRATION
  metaCatalogId: String?            # The catalog ID this belongs to
  metaProductId: String?            # Meta's internal product ID
  metaRetailerId: String?           # Our unique retailer_id (same as id.uuid)
  metaSyncStatus: String, default='pending'  # pending/syncing/synced/failed
  metaSyncedAt: DateTime?
  metaSyncError: String?
  metaSyncAttempts: int, default=0
  
  # ✅ LINK (Meta Required)
  productUrl: String?               # → Meta: link (deep link to product)
  
  # ✅ AI GENERATION
  isAiGenerated: bool, default=false
  aiGeneratedAt: DateTime?
  aiConfidenceScore: double?
  hasAiGeneratedImages: bool, default=false
  
  # ✅ DELIVERY
  shippingRequired: bool, default=true
  estimatedDeliveryDays: int?
  freeShipping: bool, default=false
  shippingCost: double, default=0.0
  
  # ✅ PERFORMANCE METRICS
  viewCount: int, default=0
  orderCount: int, default=0
  wishlistCount: int, default=0
  averageRating: double, default=0.0
  totalReviews: int, default=0
  conversionRate: double, default=0.0
  
  # ✅ SEO & SEARCH
  searchKeywords: List<String>?
  metaTitle: String?
  metaDescription: String?
  
  # ✅ TIMESTAMPS
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
  publishedAt: DateTime?
  deletedAt: DateTime?

indexes:
  vendor_status_idx:
    fields: vendorId, status
  prod_category_idx:
    fields: category, subCategory
  price_idx:
    fields: basePrice
  featured_idx:
    fields: isFeatured, isActive
  search_idx:
    fields: name, category
  meta_sync_idx:
    fields: metaSyncStatus
  cdn_upload_idx:
    fields: cdnUploadStatus
  meta_retailer_idx:
    fields: metaRetailerId
  quantity_idx:
    fields: quantity