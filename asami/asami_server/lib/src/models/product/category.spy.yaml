class: Category
table: categories
fields:
  id: UuidValue, defaultModel=random
  
  name: String
  slug: String
  description: String?
  parentCategoryId: UuidValue?
  parentCategory: Category?, relation(field=parentCategoryId)
  
  # Display
  iconUrl: String?
  imageUrl: String?
  displayOrder: int, default=0
  
  # Status
  isActive: bool, default=true
  
  # Metadata
  productCount: int, default=0
  
  # Timestamps
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  slug_idx:
    fields: slug
  parent_idx:
    fields: parentCategoryId
  active_order_idx:
    fields: isActive, displayOrder
