services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: asami
      POSTGRES_PASSWORD: "Au0OFbdEOR2vslgbyCT7S2ar1Q_wBIbG"
    volumes:
      - asami_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "-e6zSY2LWaPvbTjegnXOJTYH4dTSjMU5"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: asami_test
      POSTGRES_PASSWORD: "bZb4s1fmuyFzFzBpwb-bnt5zpar6kHsc"
    volumes:
      - asami_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "LGzNxYRa_c3CUOYXsMrQtljszjmvl_G1"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  asami_data:
  asami_test_data:
